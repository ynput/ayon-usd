# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "package.py",
]

extend-exclude = [
    "tests",
    "mkdocs_hooks.py",
    # git submodule, linted in its own repository
    "client/ayon_usd/ayon_bin_client",
]

# Same as Black.
line-length = 79
indent-width = 4

# Client code runs inside DCC interpreters, keep it py39 compatible.
target-version = "py39"

[lint]
preview = true  # this is needed for linting empty lines, etc.

pydocstyle.convention = "google"

select = ["ALL"]
ignore = [
    "PTH",
    "missing-return-type-special-method",  # missing-return-type-special-method
    "missing-trailing-comma",  # missing-trailing-comma
    "subprocess-without-shell-equals-true",    # subprocess-without-shell-equals-true
    "commented-out-code",  # commented-out-code
    "raise-vanilla-args",  # raise-vanilla-args
    "non-pep585-annotation",   # non-pep585-annotation: older python version (type vs. Type)
    "non-pep604-annotation-union",   # non-pep604-annotation-union: ..^
    "deprecated-import",   # deprecated-import: ..
    "non-pep604-annotation-optional",   # non-pep604-annotation-optional: Use `X | None` for type annotations
    "unused-method-argument",  # unused-method-argument
    "implicit-namespace-package",  # implicit-namespace-package: add `__init__.py` to namespaced package
    "line-contains-todo",  # line-contains-todo: FIX all TODOs
    "missing-todo-link",   # missing-todo-link: missing issue link
    "suspicious-subprocess-import",    # suspicious-subprocess-import: subprocess module can be insecure
    "import-outside-top-level", # import-outside-top-level: import must be on top of the file
    "missing-copyright-notice",  # missing-copyright-notice: missing copyright header
    "missing-todo-author",  # missing-todo-author: TODOs are not attributed in this repo
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# AYON server addon class must live in the package `__init__.py`
"server/__init__.py" = ["non-empty-init-module"]
"server/settings/*.py" = [
    # Settings model docstrings are shown in the settings UI
    "undocumented-public-class",
    # `_isGroup` and similar are AYON settings model attributes
    "mixed-case-variable-in-class-scope",
    # Postponed annotations are not safe with pydantic settings models
    "future-rewritable-type-annotation",
]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
