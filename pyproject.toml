[project]
version = "1.0.1"
name = "ayon-usd"
description = "AYON Addon providing USD support"
authors = [
    {name = "Ynput s.r.o.", email = "info@ynput.io"}
]
license = {file = "LICENSE"}
readme = "README.md"

requires-python = ">=3.11,<3.12"

dependencies = [
    "ayon-python-api>=1.2.20,<2.0.0",
    "ruff>=0.15.0",
    "ty",
    "pre-commit>=3.6.2",
    "codespell>=2.2.6",
    "pydocstyle>=0.0.0",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.6.7",
    "mkdocs-autoapi >= 0.4.0",
    "mkdocstrings-python >= 1.16.2",
    "mkdocs-minify-plugin >= 0.8.0",
    "markdown-checklist >= 0.4.4",
    "mdx-gh-links >= 0.4",
    "pymdown-extensions >= 10.14.3",
    "mike >= 2.1.3",
    "mkdocstrings-shell >= 1.0.2",
]
tests = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-print>=1.0.0",
    "ruff>=0.15.0",
    "pre-commit>=3.6.2",
    "codespell>=2.2.6",
    "pydocstyle>=0.0.0",
    "requests>=2.26.0",
    "semver>=3.0.2",
    "clique>=2.0.0",
]


[project.urls]
homepage = "https://ynput.io"
documentation = "https://ayon.ynput.io"
repository = "https://github.com/ynput/ayon-usd"

[tool.uv]
package = false

[tool.codespell]
# Ignore words that are not in the dictionary.
ignore-words-list = "ayon,ynput"
skip = "./.*,./client/ayon_usd/downloads,*/vendor/*,./downloads,./package,./private"
count = true
quiet-level = 3
